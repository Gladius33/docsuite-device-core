name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libcups2-dev \
            libsane-dev \
            qt6-base-dev \
            libtesseract-dev \
            tesseract-ocr-eng \
            tesseract-ocr-fra \
            libopencv-dev

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DDOCSUITE_BUILD_DESKTOP=ON
          -DDOCSUITE_BUILD_SERVICE=ON
          -DDOCSUITE_BUILD_TESTS=ON
          -DDOCSUITE_ENABLE_OCR=ON
          -DDOCSUITE_ENABLE_OPENCV=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Direct eSCL integration test
        run: |
          python3 tests/escl_mock_server.py 18080 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 0.5
          ./build/apps/cli/docsuite-device-cli \
            scan 'escl:http://127.0.0.1:18080' build/escl-mock.pnm 300 color
          python3 - <<'PY'
          from pathlib import Path
          data = Path('build/escl-mock.pnm').read_bytes()
          assert data.startswith(b'P6\n4 3\n255\n'), data[:64]
          assert len(data) >= len(b'P6\n4 3\n255\n') + 4 * 3 * 3
          print('Direct eSCL mock scan: OK')
          PY
          kill "$SERVER_PID"
          trap - EXIT

      - name: Local service integration test
        run: |
          export XDG_RUNTIME_DIR="$PWD/build/runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          ./build/services/device-service/docsuite-device-service &
          SERVICE_PID=$!
          trap 'kill "$SERVICE_PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json
          import os
          import socket
          import time

          path = os.path.join(os.environ['XDG_RUNTIME_DIR'], 'docsuite-device-core.sock')
          deadline = time.time() + 5
          while not os.path.exists(path) and time.time() < deadline:
              time.sleep(0.05)
          assert os.path.exists(path), path

          with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as client:
              client.connect(path)
              client.sendall(b'{"id":1,"method":"ping","params":{}}\n')
              data = b''
              while b'\n' not in data:
                  chunk = client.recv(4096)
                  assert chunk
                  data += chunk
          response = json.loads(data.split(b'\n', 1)[0])
          assert response['id'] == 1
          assert response['ok'] is True
          assert response['result']['service'] == 'docsuite-device-service'
          assert response['result']['version'] == '0.5.0'
          print('DocSuite Unix socket service: OK')
          PY
          kill "$SERVICE_PID"
          trap - EXIT

      - name: Build Debian package
        if: matrix.build_type == 'Release'
        run: cmake --build build --target package

      - name: Upload Debian package
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: docsuite-device-core-deb
          path: build/*.deb
          if-no-files-found: error

  mcp:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MCP dependencies
        working-directory: integrations/mcp
        run: npm install --no-audit --no-fund

      - name: Type-check MCP sidecar
        working-directory: integrations/mcp
        run: npm run build
