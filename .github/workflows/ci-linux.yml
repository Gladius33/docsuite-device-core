name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libcups2-dev \
            libsane-dev \
            qt6-base-dev \
            libtesseract-dev \
            tesseract-ocr-eng \
            tesseract-ocr-fra \
            libopencv-dev

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DDOCSUITE_BUILD_DESKTOP=ON
          -DDOCSUITE_BUILD_SERVICE=ON
          -DDOCSUITE_BUILD_TESTS=ON
          -DDOCSUITE_ENABLE_OCR=ON
          -DDOCSUITE_ENABLE_OPENCV=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build Debian package
        if: matrix.build_type == 'Release'
        run: cmake --build build --target package

      - name: Upload Debian package
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: docsuite-device-core-deb
          path: build/*.deb
          if-no-files-found: error

  mcp:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MCP dependencies
        working-directory: integrations/mcp
        run: npm install --no-audit --no-fund

      - name: Type-check MCP sidecar
        working-directory: integrations/mcp
        run: npm run build
